generated: '2026-08-13'
method: searched
source: https://www.sugarai.com/pricing
description: >-
  Published subscription pricing for the SugarAI (formerly SugarCRM) platform,
  read from the public pricing page. Three named tiers are listed with per-user
  list prices, all billed annually with a 15-user minimum. Pricing is
  seat-based subscription pricing for the CRM product - the Sugar REST API is
  included with the subscription and is not separately metered or priced, and no
  API-specific plan, quota, or overage is published. Customized packaging is
  available through sales.
