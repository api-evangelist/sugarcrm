apis:
- name: Sugar REST API
  description: >-
    The Sugar REST API is hosted on each Sugar deployment at
    https://<site_url>/rest/v{version}/ (v10 through v11_20). It authenticates
    with two-legged OAuth 2.0 (password + refresh_token grants, OAuth-Token
    header), returns JSON with ISO 8601 dates, uses offset pagination, and
    exposes CRM modules through /{module} and /{module}/filter routes.
