apis:
- name: Sugar REST API
  description: >-
    The Sugar REST API is hosted on each Sugar deployment at
    https://<site_url>/rest/v{version}/ (v10 through v11.27). SugarCloud
    instances are hosted on Sugar's own sugarondemand.com domain, so a cloud
    tenant's base is https://{instance}.sugarondemand.com/rest/v11_27/; on-site
    deployments substitute the customer's own site URL. It authenticates with
    two-legged OAuth 2.0 (password + refresh_token grants, OAuth-Token header),
    returns JSON with ISO 8601 dates, uses offset pagination, and exposes CRM
    modules through /{module} and /{module}/filter routes. Each instance serves
    its own endpoint reference at /rest/v{version}/help; no public OpenAPI is
    published.
  humanURL: https://support.sugarai.com/documentation/sugar_developer/sugar_developer_guide_26.1/integration/web_services/rest_api/
  baseURL: https://{instance}.sugarondemand.com/rest/v11_27/
