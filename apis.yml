aid: sugarcrm
name: SugarCRM
description: >-
  SugarCRM — rebranded as SugarAI in April 2026, with www.sugarcrm.com now
  redirecting to www.sugarai.com — is a B2B sales CRM platform serving 4,000+
  customers and over one million users across 120+ countries. Its product suite
  spans Sugar Sell (sales automation), Sugar Serve (customer service), Sugar
  Market (marketing automation), and sales-i (sales intelligence from ERP data),
  with an emphasis on domain-specific AI that surfaces opportunities and
  recommends next actions and native integration with 180+ ERP systems. Sugar
  exposes a REST API on every deployment at https://<site_url>/rest/v{version}/
  (v10 through v11.27 as of the 26.1 Developer Guide), authenticated with
  two-legged OAuth 2.0 and returning JSON. The API covers CRM modules (Accounts,
  Contacts, Leads, Opportunities, Cases and more) with offset pagination, a
  /{module}/filter query surface, and role-based access control. Outbound events
  are delivered as Web Logic Hooks through the instance job queue. Official
  client libraries include the JavaScript Ventana connector and the PHP REST
  SDK. There is no public OpenAPI — the endpoint reference is served per
  instance at /rest/v{version}/help.
