description: >-
  First-party SugarCRM client libraries for the Sugar REST API, verified against
  the public package registries and the SugarCRM GitHub organizations. Ventana is
  the actively maintained JavaScript connector used by Sugar's own Sidecar
  client. The PHP SDK MOVED: packagist marks sugarcrm/rest-php-client as
  abandoned in favour of sugarcrm-developers/php-rest-client, which is the
  currently released PHP client (1.1.1, 2026-06-17). Versions and publish dates
  below are read from the registry metadata endpoints, not from prose.
